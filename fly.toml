# Fly.io deployment. First time:
#   fly launch --no-deploy --copy-config   (choose an app name)
#   fly secrets set DATABASE_URL=postgres://... SMTP_ENCRYPTION_KEY=$(openssl rand -base64 32)
#   fly secrets set DATABASE_CA_CERT="$(cat prod-ca-2021.crt)"   (Supabase's CA certificate)
#   fly deploy
app = "lexledger"
# Mumbai, close to users in India. Keep Postgres in Mumbai too (e.g. Supabase or AWS RDS in
# ap-south-1); Neon has no Indian region, its nearest is Singapore
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  # Chrome needs ~1 GB to render PDFs reliably
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
