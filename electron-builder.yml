appId: com.lexledger.app
productName: LexLedger

directories:
  output: dist-electron
  buildResources: build

mac:
  category: public.app-category.business
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        # - x64
    # - target: zip
    #   arch:
    #     - arm64
    #     - x64
  icon: build/icon.icns
  darkModeSupport: true

win:
  target:
    - target: nsis
      arch:
        - x64
        # - arm64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# The app is a shell around the hosted web app (electron/app-config.json says where): only the
# compiled shell is packaged. No server, client build or Chrome.
files:
  - "package.json"
  - "electron/dist/**/*"
  - "electron/app-config.json"

asar: true
npmRebuild: false
